# SAB: motor automático, UMA vez por dia (versão 2026.11.08)
# Roda o 05b (gravação) todo dia às 23h07 de Brasília (02h07 UTC do dia seguinte; o GitHub costuma começar uns 40 min
# depois do agendado, ~23h47, e a rodada leva ~20 min). [2026.11.08] Uma rodada só, à noite: ela pega o dia novo do
# ERA5-Land (que chega durante o dia) e a rodada 00Z do GFS do mesmo dia (completa no Earth Engine por volta das 05h30
# de Brasília; K21 parte G). Serve para a V1.5 (rodar_motor.py 2026.11.01) e para a V1.6 (rodar_motor.py 2026.11.08):
# quem escolhe a versão do motor é o rodar_motor.py. À mão (aba Actions > Motor SAB > Run workflow) dá para rodar o 05a
# (simulação, o padrão) ou o 05b. Uma execução por vez (concurrency): nunca dois motores juntos.
name: Motor SAB

on:
  schedule:
    - cron: '7 2 * * *'     # 02h07 UTC = 23h07 de Brasília
  workflow_dispatch:
    inputs:
      modo:
        description: 'simular (05a, não grava nada) ou gravar (05b)'
        type: choice
        options: [simular, gravar]
        default: simular

permissions:
  contents: write     # só para o registro mensal de atividade (ATIVIDADE.md), que mantém o agendamento ligado

concurrency:
  group: motor-sab
  cancel-in-progress: false

jobs:
  motor:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar as bibliotecas
        run: pip install -r requirements.txt

      - name: Testes do lançador (sem Earth Engine)
        run: python testes/teste_rodar_motor.py

      - name: Credencial do Earth Engine
        env:
          EE_CREDENCIAL: ${{ secrets.EE_CREDENCIAL }}
        run: |
          if [ -z "$EE_CREDENCIAL" ]; then echo "Falta o segredo EE_CREDENCIAL neste repositório"; exit 1; fi
          mkdir -p ~/.config/earthengine
          printf '%s' "$EE_CREDENCIAL" > ~/.config/earthengine/credentials

      - name: Rodar o motor
        env:
          MODO: ${{ github.event_name == 'schedule' && 'gravar' || inputs.modo }}
          PYTHONUNBUFFERED: '1'
        run: python rodar_motor.py

      - name: Guardar a prévia da simulação
        if: always() && github.event_name == 'workflow_dispatch' && inputs.modo == 'simular'
        uses: actions/upload-artifact@v4
        with:
          name: previa
          path: |
            previa_v15.csv
            previa_v16.csv
          if-no-files-found: ignore

      - name: Apagar a credencial da máquina
        if: always()
        run: rm -f ~/.config/earthengine/credentials

      - name: Registro mensal de atividade (o GitHub desliga agendamentos de repositório parado há 60 dias)
        if: success() && github.event_name == 'schedule'
        run: |
          echo "Última execução agendada do motor registrada no mês: $(date -u +%Y-%m)" > ATIVIDADE.md
          if ! git diff --quiet -- ATIVIDADE.md 2>/dev/null || ! git ls-files --error-unmatch ATIVIDADE.md >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ATIVIDADE.md
            git commit -m "Registro mensal de atividade do motor"
            git push
          fi
